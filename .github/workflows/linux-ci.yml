name: Linux CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh tests/*.sh; do sh -n "$script"; done
      - name: Test standalone-session preflight and supervisor without DRM access
        run: sh tests/standalone_session_test.sh
      - name: Verify isolated launcher refuses unsafe direct-session start
        run: |
          runtime="$RUNNER_TEMP/wtl-private-runtime"
          mkdir -m 700 "$runtime"
          if env -u WAYLAND_DISPLAY XDG_RUNTIME_DIR="$runtime" sh scripts/start-isolated-preview.sh >"$RUNNER_TEMP/isolated-preview.log" 2>&1; then
            echo "The isolated launcher unexpectedly accepted a missing Wayland session."
            exit 1
          fi
          grep -q "WAYLAND_DISPLAY is not set" "$RUNNER_TEMP/isolated-preview.log"
          rmdir "$runtime"
      - name: Test isolated preview launch and preflight refusal paths
        run: sh tests/isolated_preview_test.sh
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build qt6-base-dev qt6-wayland gdb qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-dialogs weston wayland-utils xwayland x11-utils xauth
      - name: Test nested Weston backend without physical display access
        run: sh tests/weston_nested_smoke.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Verify CLI version metadata
        run: |
          ./build/src/app/win-to-linux --version >"$RUNNER_TEMP/version.txt" 2>&1
          grep -q '^Win-To-Linux 0.2.0$' "$RUNNER_TEMP/version.txt"
      - name: Verify Qt Wayland plugin is detected by diagnostics
        run: |
          QT_QPA_PLATFORM=offscreen ./build/src/app/win-to-linux --diagnostic-report >"$RUNNER_TEMP/system-diagnostics.txt" 2>&1
          grep -q '^Qt Wayland platform plugin: available$' "$RUNNER_TEMP/system-diagnostics.txt"
      - name: Smoke-test the actual Qt shell inside nested Wayland
        run: WTL_APP_BIN="$PWD/build/src/app/win-to-linux" sh tests/weston_nested_smoke.sh
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke-test Qt Quick desktop startup
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 8s ./build/src/app/win-to-linux >"$RUNNER_TEMP/gui-smoke.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            cat "$RUNNER_TEMP/gui-smoke.log"
            echo "GUI smoke test did not stay running (exit $rc)."
            exit 1
          fi
          if grep -E "QQmlApplicationEngine failed to load component|Type .* unavailable|ReferenceError:" "$RUNNER_TEMP/gui-smoke.log"; then
            cat "$RUNNER_TEMP/gui-smoke.log"
            exit 1
          fi
      - name: Smoke-test maximized shell mode
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 5s ./build/src/app/win-to-linux --maximized >"$RUNNER_TEMP/gui-maximized-smoke.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            cat "$RUNNER_TEMP/gui-maximized-smoke.log"
            echo "Maximized GUI smoke test did not stay running (exit $rc)."
            exit 1
          fi
          if grep -E "QQmlApplicationEngine failed to load component|Type .* unavailable|ReferenceError:" "$RUNNER_TEMP/gui-maximized-smoke.log"; then
            cat "$RUNNER_TEMP/gui-maximized-smoke.log"
            exit 1
          fi
      - name: Verify install staging
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/wtl-install"
          test -x "$RUNNER_TEMP/wtl-install/bin/win-to-linux"
          test -x "$RUNNER_TEMP/wtl-install/bin/win-to-linux-isolated-preview"
          test -x "$RUNNER_TEMP/wtl-install/bin/win-to-linux-standalone-session"
          test -x "$RUNNER_TEMP/wtl-install/bin/capture-xwayland-env.sh"
          test -f "$RUNNER_TEMP/wtl-install/share/applications/win-to-linux.desktop"
          grep -q '^Exec=win-to-linux$' "$RUNNER_TEMP/wtl-install/share/applications/win-to-linux.desktop"
      - name: Verify uninstall staging
        run: |
          PREFIX="$RUNNER_TEMP/wtl-install" sh scripts/uninstall-user.sh
          test ! -e "$RUNNER_TEMP/wtl-install/bin/win-to-linux"
          test ! -e "$RUNNER_TEMP/wtl-install/bin/win-to-linux-isolated-preview"
          test ! -e "$RUNNER_TEMP/wtl-install/bin/win-to-linux-standalone-session"
          test ! -e "$RUNNER_TEMP/wtl-install/bin/capture-xwayland-env.sh"
          test ! -e "$RUNNER_TEMP/wtl-install/share/applications/win-to-linux.desktop"
      - name: System diagnostic
        run: ./build/src/app/win-to-linux --system
      - name: Session diagnostic
        run: ./build/src/app/win-to-linux --session-check
      - name: Verify diagnostic report output
        shell: bash
        run: |
          ./build/src/app/win-to-linux --diagnostic-report > "$RUNNER_TEMP/diagnostic-report.txt" 2>&1
          grep -q '^Win-To-Linux diagnostic report' "$RUNNER_TEMP/diagnostic-report.txt"
          grep -q '^Runtime check:' "$RUNNER_TEMP/diagnostic-report.txt"
          grep -q '^Compositor executables:' "$RUNNER_TEMP/diagnostic-report.txt"
          grep -q '^Nested preview readiness:' "$RUNNER_TEMP/diagnostic-report.txt"
      - name: Verify standalone session readiness safely refuses a headless runner
        shell: bash
        run: |
          set +e
          env -u WTL_ENABLE_DRM_SESSION -u DISPLAY -u WAYLAND_DISPLAY ./build/src/app/win-to-linux --standalone-check > "$RUNNER_TEMP/standalone-check.txt" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            cat "$RUNNER_TEMP/standalone-check.txt"
            echo "Standalone check should refuse a non-interactive runner (exit 2), got $rc."
            exit 1
          fi
          grep -q '^Not ready for standalone session:' "$RUNNER_TEMP/standalone-check.txt"
          grep -q 'WTL_ENABLE_DRM_SESSION=1' "$RUNNER_TEMP/standalone-check.txt"
          grep -q 'real Linux virtual terminal' "$RUNNER_TEMP/standalone-check.txt"
      - name: Verify preview preflight safely refuses a headless environment
        shell: bash
        run: |
          set +e
          ./build/src/app/win-to-linux --preview-check > "$RUNNER_TEMP/preview-check.txt" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 2 ]; then
            cat "$RUNNER_TEMP/preview-check.txt"
            echo "Preview preflight should refuse this headless runner (exit 2), got $rc."
            exit 1
          fi
          grep -q '^Not ready for nested preview:' "$RUNNER_TEMP/preview-check.txt"
