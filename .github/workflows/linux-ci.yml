name: Linux CI
on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh; do sh -n "$script"; done
      - name: Verify isolated launcher refuses unsafe direct-session start
        run: |
          if env -u WAYLAND_DISPLAY XDG_RUNTIME_DIR="$RUNNER_TEMP" sh scripts/start-isolated-preview.sh >"$RUNNER_TEMP/isolated-preview.log" 2>&1; then
            echo "The isolated launcher unexpectedly accepted a missing Wayland session."
            exit 1
          fi
          grep -q "WAYLAND_DISPLAY is not set" "$RUNNER_TEMP/isolated-preview.log"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-dialogs
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Verify install staging
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/wtl-install"
          test -x "$RUNNER_TEMP/wtl-install/bin/win-to-linux"
          test -f "$RUNNER_TEMP/wtl-install/share/applications/win-to-linux.desktop"
          grep -q '^Exec=win-to-linux$' "$RUNNER_TEMP/wtl-install/share/applications/win-to-linux.desktop"
      - name: System diagnostic
        run: ./build/src/app/win-to-linux --system
      - name: Session diagnostic
        run: ./build/src/app/win-to-linux --session-check
