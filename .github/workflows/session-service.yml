name: User session service checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts and service packaging
        run: sh tests/session_service_test.sh
      - name: Validate systemd unit syntax
        run: |
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          sed 's#^ExecStart=.*#ExecStart=/usr/bin/true#' packaging/systemd/user/Win-To-Linux.service > "$tmpdir/Win-To-Linux.service"
          systemd-analyze verify --man=no "$tmpdir/Win-To-Linux.service"
